name: Playwright Automation CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Define environment variables (non-sensitive)
    env:
      PLAYWRIGHT_PASSWORD: ${{ secrets.OHRM_PASSWORD }}
      PLAYWRIGHT_USERNAME: ${{ secrets.OHRM_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=chromium --headed
